base_experiment: 0818_shot_window_v1_short.yaml

name: 0818_shot_window_stage1_curriculum_short

output:
  name: 0818_shot_window_residual_model_search
  tag: shot_window_stage1_curriculum_template

pilot_matrix:
  run_suffix: shot_window_stage1_v1
  seeds: [5101, 5102]
  observations:
    - label: t16_all
      mode: tactical16
      contract: {version: tactical16.v1, normalization_version: tactical16.norm.v1, health_source: unavailable_constant_one}
  notes: "Short v1 실패 분석에 따른 단일-variable Stage-1 curriculum. Gate/reward/action/observation/scale은 고정하고 episode를 실제 shot-window 내부에서 시작한다."

env:
  max_engage_time: 1.2
  episode_step_limit: 72

env_config:
  initial_scenario:
    mode: aim_residual_curriculum
    variants:
      - name: cone_center
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [880.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 225.0]
        target_autopilot: {heading_cmd: 0.0, altitude_cmd: 5000.0, speed_cmd: 225.0}
      - name: cone_edge_left
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [880.0, -20.0, -5000.0, 0.0, 0.0, 0.0, 225.0]
        target_autopilot: {heading_cmd: 0.0, altitude_cmd: 5000.0, speed_cmd: 225.0}
      - name: cone_edge_right
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [880.0, 20.0, -5000.0, 0.0, 0.0, 0.0, 225.0]
        target_autopilot: {heading_cmd: 0.0, altitude_cmd: 5000.0, speed_cmd: 225.0}
      - name: cone_edge_high
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [880.0, 0.0, -5020.0, 0.0, 0.0, 0.0, 225.0]
        target_autopilot: {heading_cmd: 0.0, altitude_cmd: 5020.0, speed_cmd: 225.0}
      - name: cone_edge_low
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [880.0, 0.0, -4980.0, 0.0, 0.0, 0.0, 225.0]
        target_autopilot: {heading_cmd: 0.0, altitude_cmd: 4980.0, speed_cmd: 225.0}

runtime:
  iterations: 20
  max_effective_learner_time_s: 1800
