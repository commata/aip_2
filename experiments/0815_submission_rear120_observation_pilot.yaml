name: 0815_submission_rear120_observation_pilot_matrix
script: train_rllib

output:
  name: 0815_hybrid_submission_pilot
  tag: matrix_template

pilot_matrix:
  # r0은 CSV schema 오류로 첫 iteration 저장 전에 중단되어 보존한다.
  run_suffix: r1
  seeds: [3101, 3102]
  observations:
    - label: r10
      mode: aim_residual10_v2
      contract: {version: legacy, normalization_version: legacy, health_source: simulator}
    - label: t16
      mode: tactical16
      contract: {version: tactical16.v1, normalization_version: tactical16.norm.v1, health_source: unavailable_constant_one}

env:
  observation_mode: aim_residual10_v2
  target_profile_pool:
    - {profile: autopilot_crossing, weight: 2.0}
    - {profile: bt_0815, weight: 1.0}
    - {profile: bt_aip2, weight: 1.0}
  bt_rule_xml: 'C:\Users\shy66\Downloads\aip_final_0815\aip_final_0815\Rule_DCS_GDCC_0815.xml'
  bt_rule_aliases: [Rule_DCS_GDCC_0815.xml]
  max_engage_time: 20.0
  episode_step_limit: 1200

env_config:
  sim_hz: 60
  step_ratio: 6
  min_altitude: 300.0
  ownship_control_mode: bt_residual
  ownship_behavior_dll: 'C:\Users\shy66\Downloads\aip_final_0815\aip_final_0815\AIP_DCS_GDCC_0815.dll'
  initial_scenario:
    mode: aim_residual_curriculum
    variants:
      - name: lateral_left
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1100.0, -350.0, -5000.0, 0.0, 0.0, 5.0, 225.0]
        target_autopilot: {heading_cmd: 5.0, altitude_cmd: 5000.0, speed_cmd: 225.0}
      - name: lateral_right
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1100.0, 350.0, -5000.0, 0.0, 0.0, 355.0, 225.0]
        target_autopilot: {heading_cmd: 355.0, altitude_cmd: 5000.0, speed_cmd: 225.0}
      - name: crossing_left
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1300.0, -300.0, -5000.0, 0.0, 0.0, 15.0, 230.0]
        target_autopilot: {heading_cmd: 15.0, altitude_cmd: 5000.0, speed_cmd: 230.0}
      - name: crossing_right
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1300.0, 300.0, -5000.0, 0.0, 0.0, 345.0, 230.0]
        target_autopilot: {heading_cmd: 345.0, altitude_cmd: 5000.0, speed_cmd: 230.0}
      - name: vertical_high
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1100.0, 0.0, -5300.0, 0.0, 0.0, 0.0, 225.0]
        target_autopilot: {heading_cmd: 0.0, altitude_cmd: 5300.0, speed_cmd: 225.0}
      - name: vertical_low
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1100.0, 0.0, -4700.0, 0.0, 0.0, 0.0, 225.0]
        target_autopilot: {heading_cmd: 0.0, altitude_cmd: 4700.0, speed_cmd: 225.0}
      - name: rear_boundary_left
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1300.0, -500.0, -5000.0, 0.0, 0.0, 30.0, 225.0]
        target_autopilot: {heading_cmd: 30.0, altitude_cmd: 5000.0, speed_cmd: 225.0}
      - name: rear_boundary_right
        ownship: [0.0, 0.0, -5000.0, 0.0, 0.0, 0.0, 230.0]
        target: [1300.0, 500.0, -5000.0, 0.0, 0.0, 330.0, 225.0]
        target_autopilot: {heading_cmd: 330.0, altitude_cmd: 5000.0, speed_cmd: 225.0}
  ownship_randomization: {enabled: true, radius: 30.0, r_roll: 1.0, r_pitch: 1.0, r_heading: 1.0}
  target_randomization: {enabled: true, radius: 25.0, r_roll: 1.0, r_pitch: 1.0, r_heading: 1.0}
  observation_contract: {version: legacy, normalization_version: legacy, health_source: simulator}
  residual_training:
    scale: 0.125
    gate_kind: rear120
    composition_mode: saturation_aware
    rear120_gate: {enter_target_ata_deg: 120.0, exit_target_ata_deg: 110.0}
    offensive_gate: {min_range_m: 152.4, enter_max_range_m: 1500.0, exit_max_range_m: 2000.0, enter_ata_deg: 30.0, exit_ata_deg: 45.0, enter_min_target_ata_deg: 120.0, exit_min_target_ata_deg: 110.0}
    aim_gate: {min_range_m: 152.4, enter_angle_margin_deg: 7.0, exit_angle_margin_deg: 10.0, enter_range_margin_m: 300.0, exit_range_margin_m: 550.0, min_hold_steps: 12}
    safety_veto: {minimum_altitude_m: 350.0, minimum_speed_m_s: 170.0, maximum_closing_rate_m_s: 250.0, veto_if_all_surfaces_saturated: true}
    batch_contract: {mode: rear120_segment, minimum_target_ata_deg: 120.0, truncate_on_exit: true, mask_exit_reward: true}
  reward:
    mode: aim_residual
    aim_residual:
      step_penalty: -0.001
      aim_progress_scale: 1.0
      aim_quality_scale: 0.02
      los_rate_penalty_scale: 0.05
      cone_dwell_scale: 0.08
      damage_scale: 20.0
      residual_l2_penalty_scale: 0.02
      residual_smooth_penalty_scale: 0.03
      clipping_penalty: 0.05
      saturation_penalty: 0.02
      minimum_safe_speed_m_s: 170.0
      low_speed_penalty_scale: 0.05
      minimum_safe_altitude_m: 600.0
      low_altitude_penalty_scale: 0.10
      win_reward: 5.0
      loss_reward: -5.0
      crash_reward: -20.0
  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 128
  minibatch_size: 128
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 15000
  learning_starts: 256
  mlp: {enabled: true, fcnet_hiddens: [128, 128], fcnet_activation: relu, head_fcnet_hiddens: [], head_fcnet_activation: relu}

runtime:
  seed: 0
  iterations: 20
  max_effective_learner_time_s: 1800
  num_env_runners: 0
  num_envs_per_env_runner: 1
  rollout_fragment_length: 128
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 5
  save_native_checkpoint: false
  math_threads: 2

dashboard: {enabled: false}
policy_probe: {enabled: true, interval: 5, steps: 4, print: false}
engagement_log: {enabled: false}

notes: "Rear120 R10/T16 same-budget pilot matrix template."
